<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Inverted side-rail treatment: white tile, dark icon — the rail's resting
       state rather than its active pill. -->
  <rect width="64" height="64" rx="15" fill="#ffffff"/>
  <!-- Lucide's Mail glyph, the one the side rail uses, redrawn at 2× so it fills
       the tile. Stroke is heavier than lucide's default because at a 16px tab
       size the original weight thins out and the flap disappears. -->
  <g fill="none" stroke="#171717" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="17" width="40" height="30" rx="5"/>
    <path d="M13 23 L32 36 L51 23"/>
  </g>
</svg>
